<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Datos</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 1.5rem; background: #1a1a2e; color: #eee; }
        a.volver { display: inline-block; margin-bottom: 1rem; padding: 0.4rem 1rem; background: #ff6b6b; color: #fff; border-radius: 999px; text-decoration: none; font-weight: 600; }
        a.volver:hover { background: #ee5a5a; }
    </style>
</head>
<body>
    <a class="volver" href="index.html">← Volver al inicio</a>
    <script>
        const continuar = confirm('¿Desea registrar tus datos?');
        if (continuar) {
            let nombre = prompt('Escribe tu nombre');
            let espe = prompt('Escribe tu especialidad');
            let edad = prompt('Escribe tu edad');
            let direccion = prompt('Escribe tu direccion');
            let email = prompt('Escribe tu correo electronico');

            alert("Tu nombre es: " + nombre + "\nTu especialidad es: "
                + espe + "\nTienes: " + edad + " años" +
                "\nTu direccion es: " + direccion + "\nTu correo es: "
                + email
            );
        } else {
            alert('Tengo flojera');
        }
    </script>
</body>
</html>
