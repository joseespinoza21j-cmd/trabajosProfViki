<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción – MateFácil</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">MateFácil</a>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="teoremaPitagoras.html">Pitágoras</a></li>
                    <li><a href="teoremaTales.html">Tales</a></li>
                    <li><a href="curso.html" class="active">Inscribirse</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="hero" style="padding: 1.6rem 1rem; margin-bottom: 1.5rem;">
                <h1>Inscripción al curso</h1>
                <p>Completa el formulario para unirte.</p>
            </section>

            <div class="form-card">
                <h2>Datos de registro</h2>
                <p>Todos los campos son obligatorios.</p>

                <form id="formRegistro" onsubmit="validarFormulario(event)">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ej. Ana">
                    </div>

                    <div class="form-group">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" required placeholder="Ej. García">
                    </div>

                    <div class="form-group">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" name="edad" required min="10" max="99" placeholder="Ej. 16">
                    </div>

                    <button type="submit" class="btn btn-secondary" style="width: 100%;">
                        Registrarme
                    </button>
                </form>
            </div>

            <p class="text-center mt-3"><a href="index.html" class="btn">Volver al menú</a></p>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 MateFácil</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
