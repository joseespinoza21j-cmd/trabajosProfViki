<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 1.5rem; background: #1a1a2e; color: #eee; }
        a.volver { display: inline-block; margin-bottom: 1rem; padding: 0.4rem 1rem; background: #ff6b6b; color: #fff; border-radius: 999px; text-decoration: none; font-weight: 600; }
        a.volver:hover { background: #ee5a5a; }
    </style>
</head>
<body>
    <a class="volver" href="index.html">← Volver al inicio</a>

    
    <h1>datos</h1>
    <script>
        let nombre=String(prompt('introduce tu nombre'));
        let edad=Number(prompt('introduce tu edad'));
        let especialidad=String(prompt('introduce tu especialidad'));
        let direccion=String(prompt('introduce tu direccion'));

        document.write("nombre: "+nombre);
        document.write("<br>")
        document.write("edad: "+edad);
        document.write("<br>")
        document.write("especialidad: "+especialidad);
        document.write("<br>")
        document.write("direccion: "+direccion);

    </script>
</body>
</html>
