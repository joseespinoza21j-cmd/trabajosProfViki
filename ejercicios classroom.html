<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 1.5rem; background: #1a1a2e; color: #eee; }
        a.volver { display: inline-block; margin-bottom: 1rem; padding: 0.4rem 1rem; background: #ff6b6b; color: #fff; border-radius: 999px; text-decoration: none; font-weight: 600; }
        a.volver:hover { background: #ee5a5a; }
    </style>
</head>
<body>
    <a class="volver" href="index.html">← Volver al inicio</a>


<p id="mensaje">Hola mundo</p>
<div id="imagen"></div>
<p id="aviso">Mensaje inicial</p>
<button id="btn">Haz clic</button>
<p class="destacado">Texto importante</p>
<button class="btn">Enviar</button>

<script>

    document.getElementById("mensaje").innerHTML = "¡Bienvenido!";

    document.getElementById("imagen").innerHTML = '<img src="logo.jpg" alt="Logo">';

    var elemento = document.getElementById("aviso");
    elemento.textContent = "Hola Estudiantes";

    document.getElementById("btn").style.backgroundColor = "lightblue";

    document.querySelector(".destacado").style.color = "red";

    document.querySelector(".btn").disabled = true;
</script>
</body>
</html>
