<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones Switch</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 1.5rem; background: #1a1a2e; color: #eee; }
        a.volver { display: inline-block; margin-bottom: 1rem; padding: 0.4rem 1rem; background: #ff6b6b; color: #fff; border-radius: 999px; text-decoration: none; font-weight: 600; }
        a.volver:hover { background: #ee5a5a; }
    </style>
</head>
<body>
    <a class="volver" href="index.html">← Volver al inicio</a>
    <script>
        let opcion = parseInt(prompt(
            "¿Qué operación deseas realizar?" +
            "\n1. Suma " +
            "\n2. Resta " +
            "\n3. Multiplicación " +
            "\n4. División"
        ));
        let n1 = parseFloat(prompt("Ingresa el primer número:"));
        let n2 = parseFloat(prompt("Ingresa el segundo número:"));
        let resultado;
        switch (opcion) {
            case 1:
                resultado = n1 + n2;
                document.write("El resultado de la suma es: " + resultado);
                break;
            case 2:
                resultado = n1 - n2;
                document.write("El resultado de la resta es: " + resultado);
                break;
            case 3:
                resultado = n1 * n2;
                document.write("El resultado de la multiplicación es: " + resultado);
                break;
            case 4:
                if (n2 !== 0) {
                    resultado = n1 / n2;
                    document.write("El resultado de la división es: " + resultado);
                } else {
                    document.write("No se puede dividir entre 0");
                }
                break;
            default:
                document.write("Opción no válida");
        }
    </script>
</body>
</html>
