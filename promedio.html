<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promedio</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 1.5rem; background: #1a1a2e; color: #eee; }
        a.volver { display: inline-block; margin-bottom: 1rem; padding: 0.4rem 1rem; background: #ff6b6b; color: #fff; border-radius: 999px; text-decoration: none; font-weight: 600; }
        a.volver:hover { background: #ee5a5a; }
    </style>
</head>
<body>
    <a class="volver" href="index.html">← Volver al inicio</a>
    <script>
        let cali1 = parseFloat(prompt("Ingresa tu primer calificacion"));
        let cali2 = parseFloat(prompt("Ingresa tu segunda calificacion"));
        let cali3 = parseFloat(prompt("Ingresa tu tercera calificacion"));
        let promedio = (cali1 + cali2 + cali3) / 3;
        alert("Tu promedio es de: " + promedio);
    </script>
</body>
</html>
