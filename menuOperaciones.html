<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de operaciones basicas</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 1.5rem; background: #1a1a2e; color: #eee; }
        a.volver { display: inline-block; margin-bottom: 1rem; padding: 0.4rem 1rem; background: #ff6b6b; color: #fff; border-radius: 999px; text-decoration: none; font-weight: 600; }
        a.volver:hover { background: #ee5a5a; }
    </style>
</head>
<body>
    <a class="volver" href="index.html">← Volver al inicio</a>

    
    <script>
    let operacion = parseInt(prompt("Elige una operacion: 1.-Suma 2.-Resta 3.-Multiplicacion 4.-Division"));
    let num1 = parseFloat(prompt("escribe el primer numero"));
    let num2 = parseFloat(prompt("escribe el ssegundo numero"));
    let resultado;

    switch (operacion) {
        case 1:
            resultado = num1 + num2;
            document.write("resultado= "+ resultado);
            break;
        case 2:
            resultado = num1 - num2;
            document.write("resultado= "+ resultado);
            break;
        case 3:
            resultado = num1 * num2;
            document.write("resultado= "+ resultado);
            break;
        case 4:
            if (num2 != 0) {
                resultado = num1 / num2;
                document.write("resultado= "+ resultado);
            } else {
                document.write("no se puede dividir entre 0");
            }
            break;
        default:
            document.write("Opcion no valida");
            break;
    }
</script>
</body>
</html>
